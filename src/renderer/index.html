<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextHyke: AI Video Engine & Virtual Camera</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/wizard.css">
    <link rel="stylesheet" href="styles/command-palette.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-badge">NEXTHYKE</div>
                <h1 class="brand-title">AI Video Engine & Virtual Camera</h1>
            </div>
            <div class="header-status">
                <button class="btn btn-secondary btn-sm" id="btn-open-palette" title="Open Command Palette (Ctrl+K)">
                    <kbd>Ctrl+K</kbd> Commands
                </button>
                <div class="status-indicator">
                    <span class="status-dot" id="worker-status-dot"></span>
                    <span class="status-label" id="worker-status-text">Connecting to Native Engine...</span>
                </div>
                <div class="vram-pill" id="vram-indicator">
                    <span class="pill-label">VRAM:</span>
                    <span class="pill-value" id="vram-usage">0.0 / 1.4 GB</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Left Panel: Guided Wizard Pipeline -->
            <section class="wizard-panel">
                <nav class="wizard-steps-nav" aria-label="Wizard Steps">
                    <div class="step-nav-item active" data-step="1" id="nav-step-1">
                        <span class="step-num">1</span>
                        <div class="step-info">
                            <span class="step-name">Reference Photo</span>
                            <span class="step-status">Select & verify</span>
                        </div>
                    </div>
                    <div class="step-nav-item" data-step="2" id="nav-step-2">
                        <span class="step-num">2</span>
                        <div class="step-info">
                            <span class="step-name">Video Source</span>
                            <span class="step-status">Webcam / Video</span>
                        </div>
                    </div>
                    <div class="step-nav-item" data-step="3" id="nav-step-3">
                        <span class="step-num">3</span>
                        <div class="step-info">
                            <span class="step-name">Pre-Flight</span>
                            <span class="step-status">Diagnostics check</span>
                        </div>
                    </div>
                    <div class="step-nav-item" data-step="4" id="nav-step-4">
                        <span class="step-num">4</span>
                        <div class="step-info">
                            <span class="step-name">Live Dashboard</span>
                            <span class="step-status">Side-by-side feed</span>
                        </div>
                    </div>
                </nav>

                <!-- Dynamic Step Content Viewport -->
                <div class="step-content-viewport" id="step-viewport">
                    <!-- Populated dynamically by renderer.js -->
                </div>
            </section>
        </main>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
